name: NestTalk
options:
  bundleIdPrefix: com.nesttalk
  # ML-KEM-768 (the PQC half of the hybrid envelope) is a CryptoKit API
  # introduced in iOS 26 / macOS 26, so the production crypto — and therefore
  # the whole messaging stack — cannot start on older OS. The deployment target
  # is pinned to 26 to match: advertising 17/14 let Release builds install on
  # OS versions where chat can never come up.
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "Q2GZ8F5NV5"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    # 140.0.0 is the newest release whose macOS slice ships both the
    # per-class headers AND the RTCMTLNSVideoView / RTCCameraVideoCapturer
    # symbols. 125.0.0 compiled RTCMTLNSVideoView out of the macOS binary;
    # 141.0.0+ ship the macOS slice with only the umbrella header
    # (stasel/WebRTC#145), so do NOT bump past 140 without re-checking
    # both. Details: docs/ops/2026-04-29-macos-video.md.
    from: "140.0.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  GRDBQuery:
    url: https://github.com/groue/GRDBQuery
    from: "0.10.0"

targets:
  NestTalk-iOS:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Generate BuildInfo (git short hash)
        basedOnDependencyAnalysis: false
        script: |
          HASH=$(cd "$SRCROOT/.." && git rev-parse --short HEAD 2>/dev/null || echo nogit)
          if [ -n "$(cd "$SRCROOT/.." && git status --porcelain 2>/dev/null)" ]; then HASH="${HASH}+"; fi
          OUT="$SRCROOT/NestTalk/Generated/BuildInfo.swift"
          mkdir -p "$(dirname "$OUT")"
          printf 'enum BuildInfo { static let gitHash = "%s" }\n' "$HASH" > "$OUT"
          echo "BuildInfo gitHash=${HASH}"
    sources:
      - path: NestTalk/Shared
      - path: NestTalk/iOS
      - path: NestTalk/Generated/BuildInfo.swift
        optional: true
    dependencies:
      - framework: ThirdParty/Libbox.xcframework
        embed: true
      - sdk: libresolv.tbd        # required by the Go runtime inside Libbox (res_9_*)
      - package: WebRTC
        product: WebRTC
      - package: GRDB
        product: GRDB
      - package: GRDBQuery
        product: GRDBQuery
    info:
      path: NestTalk/iOS/Info.plist
      properties:
        CFBundleDisplayName: NestTalk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [nesttalk]
            CFBundleURLName: com.nesttalk.invite
        UIBackgroundModes: [voip, audio]
        NSCameraUsageDescription: NestTalk uses the camera to scan invite QR codes and for video calls.
        NSMicrophoneUsageDescription: NestTalk uses the microphone during voice and video calls.
        NSUserActivityTypes:
          - INStartCallIntent
          - INStartAudioCallIntent
          - INStartVideoCallIntent
        UIAppFonts:
          - Fraunces.ttf
          - Inter.ttf
          - JetBrainsMono.ttf
        # Opt into edge-to-edge layout. Without UILaunchScreen the app
        # is treated as legacy and the system status bar paints over a
        # ~44pt black strip at the top.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIViewControllerBasedStatusBarAppearance: true
        # aps-environment lives ONLY in NestTalk.{Debug,Release}.entitlements
        # (Apple reads the entitlements value, not Info.plist). Mirroring
        # it into Info.plist via $(APS_ENVIRONMENT) was a footgun: the
        # generated project doesn't enable INFOPLIST_PREPROCESS so the
        # literal "$(APS_ENVIRONMENT)" string would ship at runtime.
        # PushKitHandler.currentApnsEnv() now reads the embedded
        # entitlements blob instead.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nesttalk.ios
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: NestTalk/iOS/NestTalk.Debug.entitlements
        Release:
          # Sprint 4 Task 4.3: Release builds (incl. TestFlight) use
          # production APNs. ad-hoc-signed dev installs that exercise
          # CallKit-while-locked still need to use the Release config so
          # the matching aps-environment key is "production".
          CODE_SIGN_ENTITLEMENTS: NestTalk/iOS/NestTalk.Release.entitlements
          # Threaded into PushKitHandler.currentApnsEnv() at compile
          # time. Same source of truth as the Release entitlements
          # file so any future drift gets caught at build time.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) NESTTALK_APNS_PROD

  NestTalk-macOS:
    type: application
    platform: macOS
    preBuildScripts:
      - name: Generate BuildInfo (git short hash)
        basedOnDependencyAnalysis: false
        script: |
          HASH=$(cd "$SRCROOT/.." && git rev-parse --short HEAD 2>/dev/null || echo nogit)
          if [ -n "$(cd "$SRCROOT/.." && git status --porcelain 2>/dev/null)" ]; then HASH="${HASH}+"; fi
          OUT="$SRCROOT/NestTalk/Generated/BuildInfo.swift"
          mkdir -p "$(dirname "$OUT")"
          printf 'enum BuildInfo { static let gitHash = "%s" }\n' "$HASH" > "$OUT"
          echo "BuildInfo gitHash=${HASH}"
    sources:
      - path: NestTalk/Shared
      - path: NestTalk/macOS
      - path: NestTalk/Generated/BuildInfo.swift
        optional: true
    dependencies:
      - framework: ThirdParty/Libbox.xcframework
        embed: true
      - sdk: libresolv.tbd        # required by the Go runtime inside Libbox (res_9_*)
      - package: WebRTC
        product: WebRTC
      - package: GRDB
        product: GRDB
      - package: GRDBQuery
        product: GRDBQuery
    info:
      path: NestTalk/macOS/Info.plist
      properties:
        CFBundleDisplayName: NestTalk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [nesttalk]
            CFBundleURLName: com.nesttalk.invite
        NSCameraUsageDescription: NestTalk uses the camera for video calls.
        NSMicrophoneUsageDescription: NestTalk uses the microphone during voice and video calls.
        ATSApplicationFontsPath: "."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nesttalk.macos
      configs:
        Debug:
          # Without an entitlements file the Debug-signed macOS app has
          # no application-identifier, and kSecUseDataProtectionKeychain
          # silently rejects every read/write with OSStatus -34018. That
          # was the "every macOS launch needs a fresh invite" bug — the
          # legacy login keychain ACL changes on each Debug re-sign so
          # the modern data-protection keychain is the only durable home.
          CODE_SIGN_ENTITLEMENTS: NestTalk/macOS/NestTalk.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: NestTalk/macOS/NestTalk.Release.entitlements
          ENABLE_HARDENED_RUNTIME: "YES"

  NestTalkTests:
    type: bundle.unit-test
    platform: [iOS, macOS]
    sources:
      - NestTalkTests
    dependencies:
      - target: NestTalk-iOS
        platforms: [iOS]
      - target: NestTalk-macOS
        platforms: [macOS]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  NestTalk-macOS:
    build:
      targets:
        NestTalk-macOS: all
        NestTalkTests_macOS: [test]
    test:
      targets:
        - NestTalkTests_macOS
      gatherCoverageData: false
  NestTalk-iOS:
    build:
      targets:
        NestTalk-iOS: all
        NestTalkTests_iOS: [test]
    test:
      targets:
        - NestTalkTests_iOS
      gatherCoverageData: false
