# coturn TURN server configuration
# NestTalk relay-only media relay — pod-internal only, no public ports

# Network — TCP listener only, accessed via the sing-box coturn route
listening-ip=127.0.0.1
relay-ip=127.0.0.1
listening-port=3478
no-tls
no-dtls
no-udp

# Relay-only: no direct peer connections
no-multicast-peers

# Allow loopback peers — required because both clients relay through
# the same coturn and relay addresses resolve to 127.0.0.1
allow-loopback-peers

# UDP relay port range (pod-internal loopback only)
min-port=49152
max-port=49252

# Use static-auth-secret for time-limited credentials
# The Go server generates credentials using this shared secret
use-auth-secret
static-auth-secret=${TURN_SECRET}

# Realm
realm=${TURN_REALM}

# Logging
log-file=stdout
verbose

# Security
stale-nonce=600
no-cli
